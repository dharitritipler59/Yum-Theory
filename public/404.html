<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found (404) – Yum Theory</title>
    <meta name="description" content="The recipe or page you were looking for could not be found. Explore our healthy recipe collection on Yum Theory." />
    <meta name="robots" content="noindex, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background-color: #FAF9F5;
        color: #1C1917;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .card {
        max-width: 32rem;
        width: 100%;
        text-align: center;
      }
      .icon-circle {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 50%;
        background-color: #f5f5f4;
        border: 1px solid #e7e5e4;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
        color: #064e3b;
        font-size: 1.5rem;
      }
      .kicker {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #064e3b;
        display: block;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.2;
        margin: 0 0 0.75rem 0;
        color: #1C1917;
      }
      p {
        font-size: 0.95rem;
        color: #57534e;
        line-height: 1.6;
        margin: 0 0 1.5rem 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        padding: 0.65rem 1.25rem;
        background-color: #064e3b;
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        border-radius: 9999px;
        transition: background-color 0.2s;
      }
      .btn-primary:hover {
        background-color: #04382a;
      }
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        padding: 0.65rem 1.25rem;
        background-color: #ffffff;
        border: 1px solid #d6d3d1;
        color: #44403c;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        border-radius: 9999px;
        transition: background-color 0.2s;
      }
      .btn-secondary:hover {
        background-color: #f5f5f4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-circle">🍴</div>
      <span class="kicker">Error 404 · Page Not Found</span>
      <h1>Looks like this recipe isn't on the menu.</h1>
      <p>The page you requested may have been moved, renamed, or whisked away. Let’s get you back to something delicious and wholesome.</p>
      <div class="actions">
        <a href="/" class="btn-primary">Return to Homepage</a>
        <a href="/sitemap.xml" class="btn-secondary">View Recipe Sitemap</a>
      </div>
    </div>
  </body>
</html>
